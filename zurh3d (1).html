<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Зүрх</title>
<style>
:root{color-scheme:dark;--bg:#12060b;--fg:#ffd6e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 45%,#2a0c18,var(--bg) 70%);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
p{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;margin:0;font-size:14px;opacity:.7;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<p>Чирж эргүүл · Дугуйгаар томруул</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr;
function resize(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

let seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}

function mesh(k,th,nu,nv,jit,solid){
  const V=[];
  for(let u=0;u<=nu;u++)for(let v=0;v<=nv;v++){
    const ph=u/nu*Math.PI,t=v/nv*Math.PI*2,s=Math.sin(ph);
    const x=16*Math.pow(Math.sin(t),3)*s;
    const y=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s;
    const z=th*Math.cos(ph)*(0.55+0.45*s);
    const j=(u===0||u===nu||v===nv)?1:1+(rnd()-0.5)*jit;
    V.push([x*k*j,-(y-2)*k*j,z*k*j]);
  }
  // close seam so v=nv matches v=0
  for(let u=0;u<=nu;u++)V[u*(nv+1)+nv]=V[u*(nv+1)];
  const F=[],R=[];
  for(let u=0;u<nu;u++)for(let v=0;v<nv;v++){
    const a=u*(nv+1)+v,b=a+1,c=a+nv+2,d=a+nv+1;
    if(solid){F.push([a,b,c]);R.push(rnd());F.push([a,c,d]);R.push(rnd())}
    else{F.push([a,b,c,d]);R.push(0)}
  }
  return {V,F,R,solid};
}
const outer=mesh(1,17,18,36,0,false);
function gemMesh(k,N){
  const hp=t=>[16*Math.pow(Math.sin(t),3),-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))];
  const V=[],F=[],R=[];
  const ring=(sc,z,off)=>{const s=V.length;for(let i=0;i<N;i++){const p=hp((i+off)*2*Math.PI/N);V.push([p[0]*sc*k,2+p[1]*sc*k,z])}return s};
  const T=ring(0.5,-6,0),Cr=ring(0.8,-3.8,0.5),G1=ring(1,-1.2,0),G2=ring(1,1.2,0),P=ring(0.62,4.5,0.5);
  const c=V.length;V.push([0,2,-6.2]);
  const cu=V.length;V.push([0,2,8.5]);
  const add=(a,b,d)=>{F.push([a,b,d]);R.push(rnd())};
  for(let i=0;i<N;i++){
    const j=(i+1)%N;
    add(c,T+i,T+j);
    add(T+i,Cr+i,T+j);add(Cr+i,Cr+j,T+j);
    add(G1+i,G1+j,Cr+i);add(Cr+i,G1+j,Cr+j);
    add(G1+i,G1+j,G2+j);add(G1+i,G2+j,G2+i);
    add(G2+i,G2+j,P+i);add(P+i,G2+j,P+j);
    add(P+i,P+j,cu);
  }
  return {V,F,R,solid:true};
}
const gem=gemMesh(0.7,24);
const meshes=[outer,gem];

let rx=-0.25,ry=0.5,vx=0,vy=0.008,drag=false,lx=0,ly=0,zoom=1;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;vy=(e.clientX-lx)*0.005;vx=(e.clientY-ly)*0.005;ry+=vy;rx+=vx;lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointerup',()=>{drag=false;if(Math.abs(vy)<0.004)vy=0.008});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(2.5,Math.max(0.4,zoom*(e.deltaY>0?0.95:1.05)))},{passive:false});

function nrm(a){const l=Math.hypot(...a);return a.map(x=>x/l)}
const L=nrm([-0.4,-0.5,-0.75]),Hv=nrm([-0.4,-0.5,-1.75]),H2=nrm([0.5,0.3,-1]);

function frame(time){
  if(!drag){ry+=vy;rx+=vx;vx*=0.95;vy+=(0.008-vy)*0.02}
  const beat=1+0.06*Math.pow(Math.sin(time/260),8)+0.02*Math.sin(time/700);
  const sc=Math.min(W,H)/42*zoom*beat;
  const cx=Math.cos(rx),sx=Math.sin(rx),cy=Math.cos(ry),sy=Math.sin(ry);
  ctx.clearRect(0,0,W,H);
  const faces=[];
  for(const m of meshes){
    const P=m.V.map(p=>{
      let x=p[0]*cy+p[2]*sy, z=-p[0]*sy+p[2]*cy;
      let y=p[1]*cx-z*sx; z=p[1]*sx+z*cx;
      const f=60/(60+z);
      return [x,y,z,W/2+x*sc*f,H/2+y*sc*f];
    });
    m.F.forEach((q,i)=>{
      const pts=q.map(n=>P[n]),A=pts[0],B=pts[1],D=pts[pts.length-1];
      let ux=B[0]-A[0],uy=B[1]-A[1],uz=B[2]-A[2];
      let wx=D[0]-A[0],wy=D[1]-A[1],wz=D[2]-A[2];
      let nx=uy*wz-uz*wy,ny=uz*wx-ux*wz,nz=ux*wy-uy*wx;
      const nl=Math.hypot(nx,ny,nz)||1;nx/=nl;ny/=nl;nz/=nl;
      let mx=0,my=0,mz=0;for(const p of pts){mx+=p[0];my+=p[1];mz+=p[2]}
      mx/=pts.length;my/=pts.length;mz/=pts.length;
      if(nx*mx+ny*my+nz*mz<0){nx=-nx;ny=-ny;nz=-nz}
      const dif=Math.max(0,nx*L[0]+ny*L[1]+nz*L[2]);
      const sp=Math.pow(Math.max(0,nx*Hv[0]+ny*Hv[1]+nz*Hv[2]),m.solid?20:30);
      const sp2=Math.pow(Math.max(0,nx*H2[0]+ny*H2[1]+nz*H2[2]),14);
      faces.push({z:mz,pts,m,dif,sp,sp2,front:nz<0,rim:Math.pow(1-Math.abs(nz),2),r:m.R[i]});
    });
  }
  faces.sort((a,b)=>b.z-a.z);
  for(const f of faces){
    ctx.beginPath();
    ctx.moveTo(f.pts[0][3],f.pts[0][4]);
    for(let i=1;i<f.pts.length;i++)ctx.lineTo(f.pts[i][3],f.pts[i][4]);
    ctx.closePath();
    if(f.m.solid){
      let h=318+f.r*45,s=55+f.r*40,l=30+f.r*28+f.dif*26+f.sp*30+f.sp2*40;
      if(f.r>0.88){h=330;s=25;l=78+f.sp*14}      // white facets
      else if(f.r<0.05){h=178;s=55;l=55+f.sp2*20} // cyan glints
      else if(f.r<0.22){l*=0.6}                   // dark magenta facets
      ctx.fillStyle=`hsl(${h%360},${s}%,${Math.min(90,l)}%)`;ctx.fill();
      ctx.strokeStyle='rgba(255,230,240,0.22)';ctx.lineWidth=0.6;ctx.stroke();
    }else{
      ctx.strokeStyle=f.front?`hsla(345,90%,${55+f.rim*30+f.sp*20}%,${0.3+f.rim*0.5})`:'hsla(345,70%,40%,0.22)';
      ctx.lineWidth=f.front?0.8:0.6;ctx.stroke();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
